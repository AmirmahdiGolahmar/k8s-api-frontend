apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  # Same namespace as the backend -- this and k8s-api together are one
  # application sharing one Ingress/domain, not two separate products.
  namespace: k8s-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/amirmahdigolahmar/k8s-api-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: k8s-api
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
