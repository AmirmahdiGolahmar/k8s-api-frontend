server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses real URL paths (BrowserRouter), not hash routing --
    # a refresh on e.g. /apps has to still serve index.html so the client
    # router can take over, or nginx would 404 it.
    location / {
        try_files $uri /index.html;
    }
}
